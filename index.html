<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form | Acme Support</title>
</head>
<body>
    <header>
        <h1>Contact Form | Acme Support</h1>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/Help">Help</a></li>
                <li><a href="/Contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <hr>

    <main>
        <h2>Contact Us</h2>
        <p>Send us a message and we will get back to you</p>
        <form action="/submit-form" method="post">
            <fieldset>
                <legend>Contact details</legend>
                <p>
                    <label for="name">Full name:</label>
                    <input type="text" id="name" name="name" autocomplete="name" required>
                </p>
                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </p>
                    <label for="subject">Subject</label>
                    <select id="subject" name="subject" required>
                        <option value="">Choose a topic</option>
                        <option value="general">General Inquiry</option>
                        <option value="support">Support Request</option>
                        <option value="feedback">Feedback</option>
                    </select>
                <p>
                    <label for="message">Message:</label>
                    <br>
                    <textarea id="message" name="message" rows="6" minlength="10" aria-describedby="message-hint" required></textarea>
                </p>
                <p id="message-hint">Enter at least 10 characters.</p>
            </fieldset>

            <fieldset>
                <legend>How did you hear about us?</legend>
                <p>
                    <input type="radio" id="source-search" name="source" value="search">
                    <label for="source-search">Search</label>
                </p>
                <p>
                    <input type="radio" id="source-social" name="source" value="social">
                    <label for="source-social">Social media</label>
                </p>
                <p>
                    <input type="radio" id="source-friend" name="source" value="friend">
                    <label for="source-friend">Friend or colleague</label>
                </p>
                <p>
                    <input type="radio" id="source-other" name="source" value="other">
                    <label for="source-other">Other</label>
                </p>
                <button type="submit">Send message</button>
            </fieldset>

            <p>
                <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                <label for="newsletter">Subscribe to our newsletter</label>
            </p>
        </form>
    </main>
 <footer>
        <p>&copy; 2026 Acme Support. All rights reserved.</p>
        <p><a href="/Privacy">Privacy Policy</a> | <a href="/Terms">Terms of Service</a></p>
        <p><a href="/Contact">Contact Us</a></p>
    </footer>
</body>
</html>
